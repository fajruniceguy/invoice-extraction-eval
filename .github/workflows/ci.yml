name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    # windows-latest: the suite has only ever been run on Windows (long-path handling, PDFium)
    runs-on: windows-latest
    steps:
      # LF checkouts: scorecards record hashes of the labels and the manifest as BYTES, so a
      # CRLF checkout would not reproduce the committed ones
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: python -m uv sync
      - name: Secret scan (every commit of every ref)
        run: python tools/secret_scan.py --history
      - name: Lint
        run: python -m uv run ruff check
      - name: Tests (fast and slow)
        run: python -m uv run pytest -q -m "slow or not slow"
      - name: Re-score the committed results offline (no model, no key)
        run: python -m uv run python scripts/check_results.py
